name: Download File to Repo

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Direct download URL"
        required: true
        type: string
      destination_path:
        description: "Where to save it in the repo (e.g. downloads/file.exe)"
        required: true
        type: string

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - name: Track file type with LFS
        run: |
          EXT="*.${DEST##*.}"
          DEST="${{ inputs.destination_path }}"
          EXT="*.${DEST##*.}"
          git lfs track "$EXT"
          git add .gitattributes

      - name: Download file
        run: |
          mkdir -p "$(dirname "${{ inputs.destination_path }}")"
          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            -o "${{ inputs.destination_path }}" \
            "${{ inputs.download_url }}"
          echo "✅ Downloaded to: ${{ inputs.destination_path }}"
          ls -lh "${{ inputs.destination_path }}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.destination_path }}"
          git diff --cached --quiet && echo "⚠️ No changes to commit" && exit 0
          git commit -m "chore: download file to ${{ inputs.destination_path }}"
          git push
